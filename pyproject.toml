[project]
name = "faust-vn"
version = "0.1.0"
description = "Faust (Part I, opening) as a Ren'Py visual novel, built with vnpipe"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "vnpipe",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

# Absolute because uv resolves relative paths against the project directory and this repo is
# used from both the main checkout and `.worktrees/<name>` (two levels deeper). From the main
# checkout alone this could be `../vnpipe`. Adjust to where vnpipe is cloned.
[tool.uv.sources]
vnpipe = { path = "/home/dasemu/Hacking/Darío/vnpipe", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
