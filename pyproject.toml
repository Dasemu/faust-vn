[project]
name = "faust-vn"
version = "0.1.0"
description = "Faust (Part I, opening) as a Ren'Py visual novel, built with vnpipe"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "vnpipe",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

# vnpipe is pinned through uv.lock. After pushing vnpipe changes: `uv lock --upgrade-package vnpipe`.
# To try an unpushed vnpipe checkout: `uv run --with-editable ../vnpipe <cmd>`.
[tool.uv.sources]
vnpipe = { git = "https://github.com/Dasemu/vnpipe.git", branch = "development" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
