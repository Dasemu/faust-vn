# Work configuration: everything specific to this text lives here.
# The pipeline (vnpipe, ../vnpipe) is work-agnostic; docs/adaptation-rules.md has the rationale.

[work]
id = "faust"
title = "Fausto"
subtitle = "Primera parte — Dedicatoria, prólogos y la noche de Fausto"
author = "Johann Wolfgang von Goethe"
translator = "Teodoro Llorente"
language = "es"
# Cast id used as speaker of verse that nobody speaks (the Dedicatoria).
lyric_voice = "poet_voice"

[source]
gutenberg_id = 68566
url = "https://www.gutenberg.org/cache/epub/68566/pg68566.txt"
raw_file = "data/raw/pg68566.txt"

# Scope: the play starts at the first marker line and ends right before the
# end marker (exclusive). Both are matched as whole stripped lines; `end_occurrence`
# picks which occurrence (1-based) counts, searching after the start marker.
[scope]
start_marker = "DEDICATORIA"
end_marker = "(_Llaman._)"
end_occurrence = 1

# Speaker headings as printed (upper case, before any comma/parenthesis) -> cast id.
[speakers]
"EL DIRECTOR" = "director"
"EL POETA" = "poet"
"EL GRACIOSO" = "clown"
"RAFAEL" = "raphael"
"GABRIEL" = "gabriel"
"MIGUEL" = "michael"
"LOS TRES ARCÁNGELES" = "archangels"
"MEFISTÓFELES" = "mephisto"
"EL SEÑOR" = "lord"
"FAUSTO" = "faust"
"EL ESPÍRITU" = "spirit"

# Scene heading (as printed) -> scene id, location, time of day, default presentation.
[[scenes]]
heading = "DEDICATORIA"
id = "dedicatoria"
location = "dedication"
time_of_day = "timeless"

[[scenes]]
heading = "PRÓLOGO EN EL TEATRO"
id = "prologo_teatro"
location = "theatre"
time_of_day = "day"

[[scenes]]
heading = "PRÓLOGO EN EL CIELO"
id = "prologo_cielo"
location = "heaven"
time_of_day = "timeless"

[[scenes]]
heading = "DE NOCHE"
id = "noche"
location = "study"
time_of_day = "night"

# Cast. `sprite = false` means the character is never drawn as a standing sprite
# (see docs/adaptation-rules.md); `expressions` maps the annotation emotion
# vocabulary to the sprite expressions that exist for that character.
[cast.narrator]
name = ""
color = "#d8cfc0"

[cast.poet_voice]
# The Dedicatoria is spoken by the author-poet; rendered as full-screen text.
name = ""
color = "#e8dcc2"
sprite = false

[cast.director]
name = "El Director"
color = "#c9a25b"
sprite = true
expressions = { neutral = "neutral", solemn = "neutral", joyful = "pleased", ecstatic = "pleased", ironic = "pleased", melancholic = "worried", angry = "worried", fearful = "worried" }

[cast.poet]
name = "El Poeta"
color = "#8fa8c8"
sprite = true
expressions = { neutral = "neutral", melancholic = "neutral", solemn = "inspired", joyful = "inspired", ecstatic = "inspired", ironic = "indignant", angry = "indignant", fearful = "indignant" }

[cast.clown]
name = "El Gracioso"
color = "#c87a5a"
sprite = true
expressions = { neutral = "neutral", solemn = "neutral", melancholic = "neutral", joyful = "laughing", ecstatic = "laughing", ironic = "mocking", angry = "mocking", fearful = "neutral" }

[cast.raphael]
name = "Rafael"
color = "#f0d890"
sprite = false

[cast.gabriel]
name = "Gabriel"
color = "#d8e4f0"
sprite = false

[cast.michael]
name = "Miguel"
color = "#e8a878"
sprite = false

[cast.archangels]
name = "Los tres Arcángeles"
color = "#f4ecd0"
sprite = false

[cast.lord]
name = "El Señor"
color = "#fff4c8"
sprite = false

[cast.mephisto]
name = "Mefistófeles"
color = "#b04a3a"
sprite = true
expressions = { neutral = "neutral", solemn = "deferent", melancholic = "neutral", joyful = "sly", ecstatic = "sly", ironic = "sly", angry = "scornful", fearful = "deferent" }

[cast.faust]
name = "Fausto"
color = "#a8b890"
sprite = true
expressions = { neutral = "neutral", solemn = "neutral", ironic = "neutral", melancholic = "anguished", angry = "anguished", joyful = "ecstatic", ecstatic = "ecstatic", fearful = "fearful" }

[cast.spirit]
name = "El Espíritu"
color = "#e85a3a"
sprite = false

# Staging decisions (human judgment, see docs/adaptation-rules.md).
# A scene's `bg` is shown after its title card; `mode` is the default text mode
# ("adv" = dialogue box with sprites, "nvl" = full-screen text, no sprites).
# A cue fires right before the line with id `at`. Keys:
#   bg         background asset id to switch to
#   transition dissolve | fade | flash (white/colour flash) | slow (long dissolve)
#   tint       none | dark | red   (colour treatment of the current background)
#   mode       adv | nvl
#   hide_all   true -> remove all sprites
#   shake      true -> short screen shake
#   move       { <char> = "<pos>" } -> slide a visible sprite to left|center|right
# A scene may also pin characters on stage for the whole scene, overriding the
# annotation's on_stage/positions for them (sprite = true characters only):
#   cast       { <char> = "left|center|right", ... }
# [[overrides]] (end of file) force the emotion of a line range before expression mapping.
[staging.dedicatoria]
bg = "bg_dedication"
mode = "nvl"

[staging.prologo_teatro]
bg = "bg_theatre"
mode = "adv"
cast = { clown = "left", director = "center", poet = "right" }

[staging.prologo_cielo]
bg = "bg_heaven"
mode = "nvl"
cast = { mephisto = "left" }

[staging.noche]
bg = "bg_study"
mode = "adv"
cast = { faust = "center" }

[[cues]]
# The archangels' hymn ends; the Lord is addressed by Mephistopheles.
at = "prologo_cielo_0030"
bg = "bg_heaven_lord"
transition = "slow"
mode = "adv"

[[cues]]
at = "prologo_cielo_0161"
bg = "bg_heaven"
transition = "slow"
tint = "dark"

[[cues]]
at = "noche_0082"
bg = "bg_study_macrocosm"
transition = "slow"

[[cues]]
at = "noche_0118"
bg = "bg_study"
transition = "dissolve"
tint = "red"

[[cues]]
at = "noche_0145"
bg = "bg_study_spirit"
transition = "flash"
shake = true
move = { faust = "left" }  # keep the Spirit's flame (centre of the background) visible

# Mephistopheles is annotated "ironic" throughout; force the register where the text changes.
[[overrides]]
from = "prologo_cielo_0030"
to = "prologo_cielo_0043"
emotion = "solemn"  # deferent bow before the Lord

[[overrides]]
from = "prologo_cielo_0048"
to = "prologo_cielo_0061"
emotion = "angry"  # scornful about mankind
