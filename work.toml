# Work configuration: everything specific to this text lives here.
# The pipeline (vnpipe, ../vnpipe) is work-agnostic; docs/adaptation-rules.md has the rationale.

[work]
id = "faust"
title = "Fausto"
subtitle = "Primera parte — Dedicatoria, prólogos y la noche de Fausto"
author = "Johann Wolfgang von Goethe"
translator = "Teodoro Llorente"
language = "es"
# Cast id used as speaker of verse that nobody speaks (the Dedicatoria).
lyric_voice = "poet_voice"

[source]
gutenberg_id = 68566
url = "https://www.gutenberg.org/cache/epub/68566/pg68566.txt"
raw_file = "data/raw/pg68566.txt"

# Scope: Part I. The play starts at the first marker line and ends right before the end
# marker (exclusive); what follows is Llorente's prose summary of Part II (out of scope).
# Both are matched as whole stripped lines; `end_occurrence` picks which occurrence
# (1-based) counts, searching after the start marker.
[scope]
start_marker = "DEDICATORIA"
end_marker = "BREVE RESEÑA"
end_occurrence = 1

# Parser hints. `direction_headings`: whole lines printed in capitals that are stage
# directions or section titles (not speakers); each becomes a `direction` line.
[parser]
direction_headings = [
  "CAMPESINOS BAJO LOS TILOS",
  "ENTRA UN ESTUDIANTE",
  "ENTRA FAUSTO",
  "ENTRAN FAUSTO Y MEFISTÓFELES",
  "ENTRA MEFISTÓFELES",
  "MEFISTÓFELES, FAUSTO",
  "FAUSTO, MEFISTÓFELES",
]

