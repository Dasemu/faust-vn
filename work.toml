# Voice track: the LibriVox German dramatic reading under the Spanish text (docs/voice.md).
# `scenes` (optional) limits what `vnpipe voice` processes by default.
[voice]
text_url = "https://www.gutenberg.org/cache/epub/2229/pg2229.txt"
text_file = "data/raw/pg2229.txt"
audio_url = "https://www.archive.org/download/faust1teil_1412_librivox/faust1_{nn:02d}_goethe_64kb.mp3"
audio_dir = "data/raw/librivox"
ensembles = ["archangels", "angels_chorus", "women_chorus", "disciples_chorus", "artisans", "servant_girls", "students", "citizens", "soldiers", "peasants", "everyone", "crowd", "spirits", "apes", "chorus", "witches", "voices", "walpurgis_guests", "dream_figures", "orchestra", "trio", "wisp"]
credits = [
  "Lectura dramatizada de LibriVox, «Faust: Der Tragödie erster Teil» (dominio público): librivox.org/faust-der-tragoedie-erster-teil-by-johann-wolfgang-von-goethe",
  "Narrador: Gesine. Mefistófeles: Herman Roskams. Fausto: redaer. Margarita: Sonja. Marta: Availle. Wagner y espíritus: Herr_Klugbeisser. Valentín: ekyale.",
  "Brujas y coro de mujeres: Hokuspokus. Estudiante: DerHoepp. Doncellas: Jc Guan. Director y espíritu maligno: Stephanie König. Anciana y Xenias: Rapunzelina.",
  "Rana, Rafael y Miguel: Dirk Weber. Gabriel: Claudia Weber. Los animales: Jennifer Takhar, Viktor Horvath y Katia Postnikova.",
  "El Señor, coro de espíritus, ciudadanos y bailarines: Bastian Hepp. Campesinos: ToddHW. Poeta teatral: Ernst Pattynama. Artesano, Brander, Siebel y Altmayer: Markus Wachenheim.",
  "Lieschen, la vieja y Titania: Katieamp. Coro de ángeles: Christa. Puck y soldados: Elli. Fuegos fatuos: Laurie Anne Walden. Voces: wilwarin.",
  "Lars Rolander, Robert Steiner, Neeru Iyer, Nadine Eckert-Boulet, Anna Simon, Christian Al-Kadi, jgoebel9 y Jessi: resto del reparto del Intermedio, la Noche de Valpurgis y el coro de discípulos.",
  "Montaje de audio: Rapunzelina.",
]

