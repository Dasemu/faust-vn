# Staging decisions (human judgment, see docs/adaptation-rules.md).
# A scene's `bg` is shown after its title card; `mode` is the default text mode
# ("adv" = dialogue box with sprites, "nvl" = full-screen text, no sprites).
# A cue fires right before the line with id `at`. Keys:
#   bg         background asset id to switch to
#   transition dissolve | fade | flash (white/colour flash) | slow (long dissolve)
#   tint       none | dark | red   (colour treatment of the current background)
#   mode       adv | nvl
#   hide_all   true -> remove all sprites
#   shake      true -> short screen shake
#   move       { <char> = "<pos>" } -> slide a visible sprite to left|center|right
# A scene may also pin characters on stage for the whole scene, overriding the
# annotation's on_stage/positions for them (sprite = true characters only):
#   cast       { <char> = "left|center|right", ... }
# [[overrides]] (end of file) force the emotion of a line range before expression mapping.
[staging.dedicatoria]
bg = "bg_dedication"
mode = "nvl"

[staging.prologo_teatro]
bg = "bg_theatre"
mode = "adv"
cast = { clown = "left", director = "center", poet = "right" }

[staging.prologo_cielo]
bg = "bg_heaven"
mode = "nvl"
cast = { mephisto = "left" }

[staging.noche]
bg = "bg_study"
mode = "adv"
cast = { faust = "center" }

[[cues]]
# The archangels' hymn ends; the Lord is addressed by Mephistopheles.
at = "prologo_cielo_0030"
bg = "bg_heaven_lord"
transition = "slow"
mode = "adv"

[[cues]]
at = "prologo_cielo_0161"
bg = "bg_heaven"
transition = "slow"
tint = "dark"

[[cues]]
at = "noche_0082"
bg = "bg_study_macrocosm"
transition = "slow"

[[cues]]
at = "noche_0118"
bg = "bg_study"
transition = "dissolve"
tint = "red"

[[cues]]
at = "noche_0145"
bg = "bg_study_spirit"
transition = "flash"
shake = true
move = { faust = "left" }  # keep the Spirit's flame (centre of the background) visible

# Mephistopheles is annotated "ironic" throughout; force the register where the text changes.
[[overrides]]
from = "prologo_cielo_0030"
to = "prologo_cielo_0043"
emotion = "solemn"  # deferent bow before the Lord

[[overrides]]
from = "prologo_cielo_0048"
to = "prologo_cielo_0061"
emotion = "angry"  # scornful about mankind
