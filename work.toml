[[cues]]
# The Easter choruses ("Cristo ha resucitado") reach Faust's study: Bach's Easter cantata
# plays until the end of the scene.
at = "noche_0473"
music = "track:scenes/bach-bwv4-christ-lag.ogg"

[[cues]]
# The archangels' hymn ends; the Lord is addressed by Mephistopheles.
at = "prologo_cielo_0030"
bg = "bg_heaven_lord"
transition = "slow"
mode = "adv"

[[cues]]
at = "prologo_cielo_0161"
bg = "bg_heaven"
transition = "slow"
tint = "dark"

[[cues]]
at = "noche_0082"
bg = "bg_study_macrocosm"
transition = "slow"

[[cues]]
at = "noche_0118"
bg = "bg_study"
transition = "dissolve"
tint = "red"

[[cues]]
at = "noche_0145"
bg = "bg_study_spirit"
transition = "flash"
shake = true
move = { faust = "left" }  # keep the Spirit's flame (centre of the background) visible

[[cues]]
# Faust's sunset speech: the light fades toward dusk.
at = "puertas_ciudad_0375"
tint = "dark"
transition = "slow"

[[cues]]
# The poodle swells like a storm cloud under Faust's spell.
at = "gabinete_1_0143"
tint = "red"
transition = "slow"

[[cues]]
# The mist dissolves: Mephistopheles stands by the stove as a travelling scholar.
at = "gabinete_1_0159"
tint = "none"
transition = "flash"
shake = true

[[cues]]
# The spirits' lullaby; Faust falls asleep.
at = "gabinete_1_0367"
tint = "dark"
transition = "slow"

[[cues]]
# The pact is to be signed in blood.
at = "gabinete_2_0268"
tint = "red"
transition = "dissolve"

[[cues]]
# Back to ordinary light after the signing.
at = "gabinete_2_0278"
tint = "none"
transition = "dissolve"

[[cues]]
# The spilled wine bursts into flame.
at = "taberna_auerbach_0351"
tint = "red"
transition = "flash"
shake = true

[[cues]]
# Mephistopheles vanishes with Faust.
at = "taberna_auerbach_0389"
tint = "none"
transition = "dissolve"
hide_all = true

[[cues]]
# The cauldron boils over and the Witch appears in the flames.
at = "cocina_bruja_0165"
tint = "red"
transition = "flash"
shake = true

[[cues]]
# The flames die down.
at = "cocina_bruja_0183"
tint = "none"
transition = "dissolve"

[[cues]]
# Margarita's ballad of the King of Thule.
at = "cuartito_0128"
mode = "nvl"

[[cues]]
# The ballad ends; she finds the jewel case.
at = "cuartito_0158"
mode = "adv"

[[cues]]
# Valentín dies.
at = "calle_noche_0226"
tint = "dark"
transition = "slow"

[[cues]]
# The Dies irae begins.
at = "catedral_0022"
tint = "dark"
transition = "slow"

[[cues]]
# Margarita faints.
at = "catedral_0060"
shake = true

[[cues]]
# The witches' chorus on the summit.
at = "valpurgis_0151"
bg = "bg_harz_summit"
transition = "slow"
mode = "nvl"

[[cues]]
# Back to the dialogue of Faust and Mephistopheles at the revel.
at = "valpurgis_0234"
mode = "adv"

[[cues]]
# Dawn colours the sky.
at = "carcel_0198"
bg = "bg_prison_dawn"
transition = "slow"

# Mephistopheles is annotated "ironic" throughout; force the register where the text changes.
[[overrides]]
from = "prologo_cielo_0030"
to = "prologo_cielo_0043"
emotion = "solemn"  # deferent bow before the Lord

[[overrides]]
from = "prologo_cielo_0048"
to = "prologo_cielo_0061"
emotion = "angry"  # scornful about mankind

# English version: Bayard Taylor's verse translation (1870), Project Gutenberg #14591, mapped
# onto the Spanish speeches by `vnpipe translate build` (docs/translations.md in vnpipe).
# Never machine translated: every English line of the play is quoted verbatim from Taylor.
[translations.en]
language = "english"                # Ren'Py language name
label = "English"                   # shown in the language choice
text_url = "https://www.gutenberg.org/cache/epub/14591/pg14591.txt"
text_file = "data/raw/pg14591.txt"
gutenberg_id = 14591
title = "Faust"
subtitle = "First Part"
translator = "Bayard Taylor (1870)"
end_text = "To be continued…"
# The [voice].credits lines in this language (the recording is shared by every language).
voice_credits = [
  "LibriVox dramatic reading, “Faust: Der Tragödie erster Teil” (public domain): librivox.org/faust-der-tragoedie-erster-teil-by-johann-wolfgang-von-goethe",
  "Narrator: Gesine. Mephistopheles: Herman Roskams. Faust: redaer. Margaret: Sonja. Martha: Availle. Wagner and spirits: Herr_Klugbeisser. Valentine: ekyale.",
  "Witches and chorus of women: Hokuspokus. Student: DerHoepp. Maidens: Jc Guan. Manager and evil spirit: Stephanie König. Old woman and Xenien: Rapunzelina.",
  "Frosch, Raphael and Michael: Dirk Weber. Gabriel: Claudia Weber. The animals: Jennifer Takhar, Viktor Horvath and Katia Postnikova.",
  "The Lord, chorus of spirits, citizens and dancers: Bastian Hepp. Peasants: ToddHW. Poet: Ernst Pattynama. Apprentice, Brander, Siebel and Altmayer: Markus Wachenheim.",
  "Lieschen, the old woman and Titania: Katieamp. Chorus of angels: Christa. Puck and soldiers: Elli. Will-o’-the-wisps: Laurie Anne Walden. Voices: wilwarin.",
  "Lars Rolander, Robert Steiner, Neeru Iyer, Nadine Eckert-Boulet, Anna Simon, Christian Al-Kadi, jgoebel9 and Jessi: the rest of the cast of the Intermezzo, Walpurgis Night and the chorus of disciples.",
  "Audio editing: Rapunzelina.",
]
# Lines of the ebook that are not part of the play text.
ignore_lines = ["FIRST PART OF THE TRAGEDY"]

