name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: vnpipe is a private git dependency over SSH; CI needs a deploy key for it.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
