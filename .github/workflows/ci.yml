name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: pyproject.toml points to a local vnpipe checkout (absolute path). CI needs vnpipe
      # available at that path (e.g. an extra checkout step for the vnpipe repo) before `uv sync`.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
